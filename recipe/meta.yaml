{% set version = "1.12.0" %}

package:
  name: jupyter-releaser
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/j/jupyter-releaser/jupyter_releaser-{{ version }}.tar.gz
  sha256: e957dbf3b8c37d8251113b842350f82b4edb544a511b09ce031b6b44dab71879

build:
  number: 0
  noarch: python
  entry_points:
    - jupyter-releaser = jupyter_releaser.cli:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.11
  run:
    - click <8.2.0
    - fastcore <2
    - ghapi <=1.0.4
    - github-activity >=1.1.6,<2
    - pipx
    - importlib_resources
    - jsonschema >=4.0.0
    - mdformat
    - packaging
    - pkginfo
    - pypi-attestations >=0.0.30,<0.1
    - pypiserver ==2.3.2
    - python >={{ python_min }}
    - requests
    - requests-cache
    - sigstore >=4.5,<5
    - toml ~=0.10

test:
  imports:
    - jupyter_releaser
    - jupyter_releaser.actions
  commands:
    - jupyter-releaser --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://jupyter.org
  summary: Jupyter Releaser for Python and/or npm packages.
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/jupyter-server/jupyter_releaser

extra:
  recipe-maintainers:
    - krassowski
    - blink1073
    - jtpio
